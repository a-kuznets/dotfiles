set-option -g prefix C-Space

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

unbind-key C-h
unbind-key C-j
unbind-key C-k
unbind-key C-l

bind-key f display-popup -E "$HOME/.local/bin/tscope"
bind-key t display-popup -E "$HOME/.local/bin/wtscope"
bind-key c command-prompt -p "window name:" "new-window; rename-window '%%'"
bind-key r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"

set -g status-left-length 64

set -g mouse on
setw -g mode-keys vi

# Copy mode: v to start selection, y to yank to system clipboard
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# Capture the entire visible pane (or scrollback) to system clipboard
bind-key Y capture-pane -S - -E - \; run-shell "tmux save-buffer - | pbcopy && tmux delete-buffer" \; display-message "Pane copied to clipboard"

set -g focus-events on
set -g extended-keys on
set extended-keys-format csi-u

set -g status-style "bg=#e6e4d9,fg=#6f6e69"
set -g window-status-current-style "bg=#cecdc3,fg=#100f0f"
set -g message-style "bg=#e6e4d9,fg=#100f0f,fill=#e6e4d9"
set -g message-command-style "bg=#e6e4d9,fg=#100f0f,fill=#e6e4d9"
set -g mode-style "bg=#dad8ce,fg=#100f0f"
set -g pane-border-style "fg=#dad8ce"
set -g pane-active-border-style "fg=#b7b5ac"
